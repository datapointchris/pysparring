version: "3"

tasks:
  default:
    desc: List the available tasks
    silent: true
    cmds:
      - task --list

  # A worktree is a clean checkout, so everything gitignored is absent. The
  # virtualenv comes back from uv.lock.
  setup:
    desc: Make a fresh checkout runnable
    cmds:
      - uv sync

  build:
    desc: Build the wheel and sdist into dist/
    cmds:
      - uv build --out-dir dist

  test:
    desc: Run the test suite
    cmds:
      - uv run pytest

  lint:
    desc: Run every check without writing any file
    cmds:
      - uv run ruff format --check .
      - uv run ruff check .
      - task: typecheck

  typecheck:
    desc: Type check with mypy
    cmds:
      - uv run mypy src tests

  format:
    desc: Apply ruff's formatting and autofixes
    cmds:
      - uv run ruff format .
      - uv run ruff check --fix .
